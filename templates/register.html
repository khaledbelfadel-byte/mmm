 <!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>إنشاء الحساب</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Tahoma, Arial, sans-serif;
            background: linear-gradient(135deg, #eef4ff, #dce8ff);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 15px;
            color: #172033;
        }

        .register-box {
            width: 100%;
            max-width: 650px;
            background: #ffffff;
            border-radius: 18px;
            padding: 45px 50px;
            box-shadow: 0 15px 45px rgba(0, 0, 0, 0.12);
        }

        .title {
            text-align: center;
            font-size: 32px;
            font-weight: bold;
            color: #1769e0;
            margin-bottom: 35px;
        }

        .form-group {
            margin-bottom: 22px;
        }

        .form-group label {
            display: block;
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 9px;
            color: #273449;
        }

        .form-group input {
            width: 100%;
            height: 54px;
            padding: 0 16px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            outline: none;
            font-size: 16px;
            font-family: inherit;
            background: #f8fafc;
            transition: 0.2s;
        }

        .form-group input:focus {
            border-color: #1769e0;
            background: #ffffff;
            box-shadow: 0 0 0 3px rgba(23, 105, 224, 0.12);
        }

        .register-button {
            width: 100%;
            height: 55px;
            border: none;
            border-radius: 10px;
            background: #1769e0;
            color: #ffffff;
            font-size: 17px;
            font-weight: bold;
            font-family: inherit;
            cursor: pointer;
            margin-top: 5px;
            transition: 0.2s;
        }

        .register-button:hover {
            background: #0d56c7;
        }

        .login-text {
            text-align: center;
            margin-top: 28px;
            padding-top: 22px;
            border-top: 1px solid #e5e7eb;
            font-size: 15px;
            color: #64748b;
        }

        .login-text a {
            color: #1769e0;
            text-decoration: none;
            font-weight: bold;
            margin-right: 5px;
        }

        .login-text a:hover {
            color: #d9a400;
        }

        @media (max-width: 600px) {
            .register-box {
                padding: 35px 22px;
            }

            .title {
                font-size: 28px;
                margin-bottom: 30px;
            }

            .form-group input {
                height: 52px;
            }
        }
    </style>
</head>

<body>

    <div class="register-box">

        <h1 class="title">إنشاء الحساب</h1>

        <form method="POST" action="{{ url_for('register') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

            <div class="form-group">
                <label for="username">اسم المستخدم</label>
                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="أدخل اسم المستخدم"
                    required
                >
            </div>

            <div class="form-group">
                <label for="email">البريد الإلكتروني</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="أدخل البريد الإلكتروني"
                    required
                >
            </div>

            <div class="form-group">
                <label for="phone">رقم الهاتف</label>
                <input
                    type="tel"
                    id="phone"
                    name="phone"
                    placeholder="أدخل رقم الهاتف"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">كلمة المرور</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="أدخل كلمة المرور"
                    required
                >
            </div>

            <div class="form-group">
                <label for="confirm_password">تأكيد كلمة المرور</label>
                <input
                    type="password"
                    id="confirm_password"
                    name="confirm_password"
                    placeholder="أعد إدخال كلمة المرور"
                    required
                >
            </div>

            <button type="submit" class="register-button">
                إنشاء الحساب
            </button>

        </form>

        <div class="login-text">
            هل لديك حساب بالفعل؟
            <a href="{{ url_for('login') }}">تسجيل الدخول</a>
        </div>

    </div>

</body>
</html>
