<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>طلباتي</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:Tahoma,Arial,sans-serif;background:linear-gradient(135deg,#eef4ff,#dce8ff);min-height:100vh;color:#172033;padding:30px 15px}.box{width:100%;max-width:1100px;margin:auto;background:#fff;border-radius:18px;padding:38px 42px;box-shadow:0 15px 45px rgba(0,0,0,.12)}h1{color:#1769e0;text-align:center;margin-bottom:28px;font-size:32px}h2{color:#273449;margin:22px 0 15px;font-size:22px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:18px}.card{border:1px solid #e2e8f0;border-radius:12px;padding:18px;background:#f8fafc}.row{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}.field{margin-bottom:18px}.field label{display:block;font-weight:bold;margin-bottom:8px;color:#273449}.field input,.field textarea,.field select{width:100%;padding:13px 15px;border:1px solid #cbd5e1;border-radius:10px;background:#f8fafc;font:inherit;outline:none}.field textarea{min-height:100px;resize:vertical}.field input:focus,.field textarea:focus,.field select:focus{border-color:#1769e0;background:#fff;box-shadow:0 0 0 3px rgba(23,105,224,.12)}button,.btn{display:inline-block;border:0;border-radius:10px;background:#1769e0;color:#fff;padding:12px 18px;font:inherit;font-weight:bold;cursor:pointer;text-decoration:none;transition:.2s}button:hover,.btn:hover{background:#0d56c7}.danger{background:#dc3545}.danger:hover{background:#b91c2b}.muted{color:#64748b}.price{font-weight:bold;color:#1769e0;font-size:19px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}table{width:100%;border-collapse:collapse;margin-top:15px}th,td{padding:12px;border-bottom:1px solid #e5e7eb;text-align:right;vertical-align:middle}th{background:#f1f5f9;color:#273449}.alert{padding:12px 15px;border-radius:10px;background:#eff6ff;color:#174ea6;margin-bottom:15px}.total{font-size:22px;font-weight:bold;color:#1769e0;text-align:left;margin-top:20px}.nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px}.nav a{color:#1769e0;text-decoration:none;font-weight:bold}.empty{text-align:center;padding:45px;color:#64748b}.product-img{width:100%;height:150px;object-fit:contain;background:#fff;border-radius:10px;margin-bottom:12px}.logout{display:inline}.flash{padding:10px 14px;background:#fef3c7;border-radius:10px;margin-bottom:10px;color:#854d0e}@media(max-width:600px){.box{padding:30px 20px}h1{font-size:28px}table{font-size:13px;display:block;overflow-x:auto;white-space:nowrap}}
</style></head>
<body><div class="box"><h1>طلباتي</h1>{% if orders %}<table><thead><tr><th>رقم الطلب</th><th>الحالة</th><th>طريقة الدفع</th><th>المجموع</th><th>التاريخ</th><th></th></tr></thead><tbody>{% for order in orders %}<tr><td>#{{ order['id'] }}</td><td>{{ order['status'] }}</td><td>{{ order['payment_method'] }}</td><td>{{ '%.0f'|format(order['total']) }} دج</td><td>{{ order['created_at'] }}</td><td><a class="btn" href="{{ url_for('order_details', order_id=order['id']) }}">التفاصيل</a></td></tr>{% endfor %}</tbody></table>{% else %}<div class="empty">لا توجد طلبات حتى الآن.</div>{% endif %}</div></body></html>
